name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Lint store
        run: node scripts/lint-store.mjs
      - name: Test
        run: node --test jonbeckman-github-runner/manager/lib.test.mjs jonbeckman-github-runner/manager/test/scheduler.test.mjs jonbeckman-grafana-alloy/setup/render.test.mjs jonbeckman-grafana-alloy/setup/docker-ro.test.mjs
