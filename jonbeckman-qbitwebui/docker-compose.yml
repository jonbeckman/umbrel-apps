services:
  # Tile on port 3504 (umbrel-app.yml), behind the Umbrel login. The process
  # listens on 3000. umbrelOS 2 does not start this container. It reads
  # APP_HOST, APP_PORT, and PROXY_AUTH_ADD and proxies from the host.
  app_proxy:
    environment:
      APP_HOST: jonbeckman-qbitwebui_web_1
      APP_PORT: "3000"
      PROXY_AUTH_ADD: "true"

  web:
    image: ghcr.io/mkbula/qbitwebui:2.45.0@sha256:16902a917228443595d5faf5953d38e8a635d57b6054dbd7dbd86d49d4d6c782
    restart: unless-stopped
    init: true
    mem_limit: 512m
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    # host-gateway lets this container open the official qBittorrent tile on
    # the host (http://host.docker.internal:8094). The same app is also on
    # umbrel_main_network as qbittorrent_server_1, WebUI port 8080.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "3000"
      # umbreld exports APP_SEED before compose runs: HMAC-SHA256 of
      # "app-jonbeckman-qbitwebui-seed" with the Umbrel seed (derive_entropy
      # in legacy-compat/app-script). 64 hex characters. It is not in git.
      # qbitwebui requires ENCRYPTION_KEY of at least 32 characters
      # (src/server/utils/crypto.ts) and uses it to encrypt saved instance
      # credentials. The salt stays in /data/.salt, so this value has to
      # stay the same across restarts.
      ENCRYPTION_KEY: ${APP_SEED}
      DOWNLOADS_PATH: /downloads
      DATABASE_PATH: /data/qbitwebui.db
      SALT_PATH: /data/.salt
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # Same source the official qbittorrent app declares
      # (getumbrel/umbrel-apps qbittorrent/docker-compose.yml). umbrelOS 2
      # rewrites /data/storage/downloads to /home/Downloads and treats that
      # mount as the umbrel-downloads slot (getFolderAccessSlots in
      # packages/umbreld/source/modules/apps/app.ts). A remap of that slot,
      # such as /External/hudson/downloads, replaces this bind. :ro because
      # qbitwebui only browses the files.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/config').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
