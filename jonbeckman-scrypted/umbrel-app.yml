manifestVersion: 1.1
id: jonbeckman-scrypted
name: Scrypted
icon: https://raw.githubusercontent.com/jonbeckman/umbrel-apps/master/jonbeckman-scrypted/icon.svg
category: automation
version: "0.1.2"
tagline: Home video and HomeKit, on the host network
description: >-
  Scrypted on this Umbrel, using the host network so HomeKit mDNS
  (_hap._tcp) reaches the LAN. The image is koush/scrypted
  v0.148.0-noble-full. Cameras, plugins, and settings live in
  data/scrypted, mounted at /server/volume.


  Denny's Scrypted app can stay installed while you switch. It holds host
  port 11080, so this app's HTTP port is 11081 and its HTTPS port is
  11443. The Umbrel tile is port 3503 and stays behind the Umbrel login.
  Opening the tile is the authenticated way in. 11081 and 11443 are also
  listening on the host, and Scrypted's own login applies there.


  To bring over an existing install, copy Denny's Scrypted volume to
  /Home/scrypted-import-from-denny/scrypted. Umbrel rejects a custom mount
  whose source is under /Apps. Then add one read-only custom folder on
  service server at /import pointing at that Home folder. The first start
  that sees that mount, and no scrypted.db yet, copies the files and does
  not change the source. The steps, including clearing an empty database
  created by an earlier start, are in the app README.


  Node is started with --insecure-http-parser so Amcrest cameras on
  Scrypted v0.148.0 can complete digest authentication and the event
  stream. Without it, snapshots abort and the prebuffer never syncs.
releaseNotes: >-
  Node uses --insecure-http-parser so the Amcrest plugin can read the
  camera's digest-auth 401 replies and event stream on Scrypted v0.148.0.
  Import the old volume from a folder under /Home, such as
  /Home/scrypted-import-from-denny/scrypted. Umbrel rejects /Apps as a
  custom mount source.
developer: Scrypted
